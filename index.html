<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Growtopia Pack Calculator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">

  <header>
    <img class="logo" src="assets/growtopia-logo.png" alt="Growtopia logo" />
    <div>
      <h1>Growtopia Pack Calculator</h1>
      <p>Hitung modal, tools yang didapat, dan profit dari pack</p>
    </div>
    <button id="themeToggle" class="theme-toggle" title="Ganti tema">🌙</button>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>Harga per pack (WL)</label>
        <input type="number" id="priceWl" min="0" value="0" />
        <div class="lockline" id="priceLockline"></div>
      </div>
      <div class="field">
        <label>Jumlah pack dibeli</label>
        <input type="number" id="qtyPack" min="0" value="1" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:14px;">
      <h3 style="margin:0;">Isi tools per pack</h3>
    </div>
    <div class="grid" id="itemGrid"></div>
  </div>

  <div class="card summary">
    <div class="sum-box">
      <div class="label">Total modal</div>
      <div class="value" id="totalModal">0 WL</div>
      <div class="lockline" id="totalModalLockline"></div>
    </div>
    <div class="sum-box">
      <div class="label">Total nilai jual tools</div>
      <div class="value" id="totalRevenue">0 WL</div>
      <div class="lockline" id="totalRevenueLockline"></div>
    </div>
    <div class="sum-box profit">
      <div class="label">Profit</div>
      <div class="value" id="totalProfit">0 WL</div>
    </div>
  </div>

  <footer>Created by Bertrand</footer>
</div>

<script src="script.js"></script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Growtopia Pack Calculator</title>
<style>
  :root{
    --bg:#15171c; --panel:#1e2129; --panel2:#262a34; --border:#333844;
    --text:#eceff4; --muted:#8b91a1; --accent:#5ec26a; --danger:#e5545f;
    --wl:#c7cbd4; --dl:#5ec2f0; --bgl:#c77df0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;padding:24px 16px 80px;}
  .wrap{max-width:1000px;margin:0 auto;}
  header{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(160deg,#7ed957,#3f8f3a);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
  header h1{font-size:20px;margin:0;}
  header p{margin:2px 0 0;color:var(--muted);font-size:13px;}

  .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .tab{flex:1;min-width:140px;padding:12px;border-radius:10px;background:var(--panel);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:14px;font-weight:600;text-align:center;}
  .tab.active{background:var(--accent);color:#0e2010;border-color:var(--accent);}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px;}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .field{flex:1;min-width:180px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px;}
  .lockline{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted);}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);}
  .dot{width:9px;height:9px;border-radius:50%;}
  .dot.wl{background:var(--wl);} .dot.dl{background:var(--dl);} .dot.bgl{background:var(--bgl);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
  .item{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;}
  .item-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .item-icon{width:28px;height:28px;border-radius:6px;background:#3a2e1f;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .item-name{font-size:13px;font-weight:600;border:none;background:transparent;color:var(--text);width:100%;padding:0;}
  .item-name[readonly]{cursor:default;}
  .item-body{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;}
  .item-body .total{color:var(--accent);font-weight:700;font-size:13px;}
  .item-body input{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;}
  .item-body .qtyrow{display:flex;align-items:center;gap:6px;}
  .item-body .qtyrow input{width:60px;}
  .addbtn{background:var(--panel2);border:1px dashed var(--border);border-radius:10px;color:var(--muted);cursor:pointer;font-size:13px;padding:12px;display:flex;align-items:center;justify-content:center;}

  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .sum-box{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .sum-box .label{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .sum-box .value{font-size:18px;font-weight:700;}
  .sum-box.profit .value.pos{color:var(--accent);}
  .sum-box.profit .value.neg{color:var(--danger);}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">🌱</div>
    <div>
      <h1>Growtopia Pack Calculator</h1>
      <p>Hitung modal, tools yang didapat, dan profit dari pack</p>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>Harga per pack (WL)</label>
        <input type="number" id="priceWl" min="0" value="0" />
        <div class="lockline" id="priceLockline"></div>
      </div>
      <div class="field">
        <label>Jumlah pack dibeli</label>
        <input type="number" id="qtyPack" min="0" value="1" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:14px;">
      <h3 style="margin:0;">Isi tools per pack</h3>
    </div>
    <div class="grid" id="itemGrid"></div>
  </div>

  <div class="card summary">
    <div class="sum-box">
      <div class="label">Total modal</div>
      <div class="value" id="totalModal">0 WL</div>
      <div class="lockline" id="totalModalLockline"></div>
    </div>
    <div class="sum-box">
      <div class="label">Total nilai jual tools</div>
      <div class="value" id="totalRevenue">0 WL</div>
      <div class="lockline" id="totalRevenueLockline"></div>
    </div>
    <div class="sum-box profit">
      <div class="label">Profit</div>
      <div class="value" id="totalProfit">0 WL</div>
    </div>
  </div>

  <footer>Created by Bertrand</footer>
</div>

<script>
// ponytail: item qty untuk crime & gala belum ada data pasti dari wiki, jadi dibiarkan
// kosong + editable. isi manual sesuai pack asli in-game biar akurat.
const PACKS = {
  msurg: {
    label: "MSurg",
    items: [
      { name: "Surg-E", qty: 5 },
      { name: "Surgical Anesthetic", qty: 20 },
      { name: "Surgical Antibiotics", qty: 20 },
      { name: "Surgical Antiseptic", qty: 20 },
      { name: "Surgical Clamp", qty: 20 },
      { name: "Surgical Defibrillator", qty: 20 },
      { name: "Surgical Lab Kit", qty: 20 },
      { name: "Surgical Pins", qty: 20 },
      { name: "Surgical Scalpel", qty: 20 },
      { name: "Surgical Splint", qty: 20 },
      { name: "Surgical Sponge", qty: 20 },
      { name: "Surgical Stitches", qty: 20 },
      { name: "Surgical Transfusion", qty: 20 },
      { name: "Surgical Ultrasound", qty: 20 },
    ],
    locked: true,
  },
  crime: {
    label: "Crime",
    items: [
      { name: "Item 1", qty: 0 },
      { name: "Item 2", qty: 0 },
      { name: "Item 3", qty: 0 },
      { name: "Item 4", qty: 0 },
      { name: "Item 5", qty: 0 },
    ],
    locked: false,
  },
  gala: {
    label: "Gala",
    items: [
      { name: "Item 1", qty: 0 },
      { name: "Item 2", qty: 0 },
      { name: "Item 3", qty: 0 },
      { name: "Item 4", qty: 0 },
      { name: "Item 5", qty: 0 },
    ],
    locked: false,
  },
};

let activePack = "msurg";
// harga jual per item (WL) diinget per-pack biar ga ilang pas pindah tab
const sellPrices = { msurg: {}, crime: {}, gala: {} };

const tabsEl = document.getElementById("tabs");
const gridEl = document.getElementById("itemGrid");
const priceWlEl = document.getElementById("priceWl");
const qtyPackEl = document.getElementById("qtyPack");

function formatLocks(totalWl) {
  totalWl = Math.max(0, Math.round(totalWl));
  const bgl = Math.floor(totalWl / 10000);
  const dl = Math.floor((totalWl % 10000) / 100);
  const wl = totalWl % 100;
  const parts = [];
  if (bgl > 0) parts.push(`<span class="badge"><span class="dot bgl"></span>${bgl} BGL</span>`);
  if (dl > 0) parts.push(`<span class="badge"><span class="dot dl"></span>${dl} DL</span>`);
  parts.push(`<span class="badge"><span class="dot wl"></span>${wl} WL</span>`);
  return parts.join(" ");
}

function renderTabs() {
  tabsEl.innerHTML = "";
  Object.keys(PACKS).forEach((key) => {
    const btn = document.createElement("div");
    btn.className = "tab" + (key === activePack ? " active" : "");
    btn.textContent = PACKS[key].label;
    btn.onclick = () => { activePack = key; renderTabs(); renderGrid(); };
    tabsEl.appendChild(btn);
  });
}

function renderGrid() {
  const pack = PACKS[activePack];
  gridEl.innerHTML = "";
  pack.items.forEach((item, idx) => {
    const el = document.createElement("div");
    el.className = "item";
    const sellKey = item.name + "#" + idx;
    const sellVal = sellPrices[activePack][sellKey] ?? 0;
    el.innerHTML = `
      <div class="item-head">
        <div class="item-icon">🧰</div>
        <input class="item-name" value="${item.name}" ${pack.locked ? "readonly" : ""} data-idx="${idx}" />
      </div>
      <div class="item-body">
        <div class="qtyrow">
          <span>qty/pack:</span>
          <input type="number" min="0" class="qty-input" data-idx="${idx}" value="${item.qty}" ${pack.locked ? "readonly" : ""} />
        </div>
        <div class="qtyrow">
          <span>jual/item (WL):</span>
          <input type="number" min="0" class="sell-input" data-idx="${idx}" value="${sellVal}" />
        </div>
        <div class="total" data-total-idx="${idx}">total: 0</div>
      </div>
    `;
    gridEl.appendChild(el);
  });

  gridEl.querySelectorAll(".item-name").forEach((inp) => {
    inp.addEventListener("input", (e) => {
      PACKS[activePack].items[e.target.dataset.idx].name = e.target.value;
    });
  });
  gridEl.querySelectorAll(".qty-input").forEach((inp) => {
    inp.addEventListener("input", (e) => {
      PACKS[activePack].items[e.target.dataset.idx].qty = Number(e.target.value) || 0;
      compute();
    });
  });
  gridEl.querySelectorAll(".sell-input").forEach((inp) => {
    inp.addEventListener("input", (e) => {
      const idx = e.target.dataset.idx;
      const key = PACKS[activePack].items[idx].name + "#" + idx;
      sellPrices[activePack][key] = Number(e.target.value) || 0;
      compute();
    });
  });

  compute();
}

function compute() {
  const pack = PACKS[activePack];
  const priceWl = Number(priceWlEl.value) || 0;
  const qtyPack = Number(qtyPackEl.value) || 0;
  const totalModal = priceWl * qtyPack;

  document.getElementById("priceLockline").innerHTML = formatLocks(priceWl);
  document.getElementById("totalModal").textContent = totalModal.toLocaleString("id-ID") + " WL";
  document.getElementById("totalModalLockline").innerHTML = formatLocks(totalModal);

  let totalRevenue = 0;
  pack.items.forEach((item, idx) => {
    const totalQty = item.qty * qtyPack;
    const sellKey = item.name + "#" + idx;
    const sellPrice = sellPrices[activePack][sellKey] || 0;
    const itemRevenue = totalQty * sellPrice;
    totalRevenue += itemRevenue;
    const totalEl = gridEl.querySelector(`[data-total-idx="${idx}"]`);
    if (totalEl) totalEl.textContent = `total: ${totalQty.toLocaleString("id-ID")} (senilai ${itemRevenue.toLocaleString("id-ID")} WL)`;
  });

  document.getElementById("totalRevenue").textContent = totalRevenue.toLocaleString("id-ID") + " WL";
  document.getElementById("totalRevenueLockline").innerHTML = formatLocks(totalRevenue);

  const profit = totalRevenue - totalModal;
  const profitEl = document.getElementById("totalProfit");
  profitEl.textContent = (profit >= 0 ? "+" : "") + profit.toLocaleString("id-ID") + " WL";
  profitEl.className = "value " + (profit >= 0 ? "pos" : "neg");
}

priceWlEl.addEventListener("input", compute);
qtyPackEl.addEventListener("input", compute);

renderTabs();
renderGrid();
</script>
</body>
</html>
